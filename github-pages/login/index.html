<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="app-root" content="../" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'" />
    <meta name="description" content="登录课间，管理属于自己的课程表" />
    <title>注册 / 登录 · 课间</title>
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body class="account-page">
    <header class="topbar">
      <a class="brand" href="./?mode=register"><span class="brand-mark" aria-hidden="true">课</span><span>课间</span><span class="brand-suffix">/ 个人课表</span></a>
      <nav aria-label="主要导航"><a class="nav-link active" href="./?mode=register">注册 / 登录</a><a class="nav-link" href="https://wangaoqi23.github.io/class-timetable/admin/">管理员后台</a></nav>
    </header>
    <main class="auth-shell">
      <section class="auth-intro">
        <p class="eyebrow">YOUR SCHEDULE, EVERYWHERE</p>
        <h1>一份课表，随时查看和分享</h1>
        <p class="subtle">登录后可在当前设备保存多份独立课表，并通过链接邀请同学一键导入。</p>
        <ul class="feature-list"><li>每个账户拥有独立数据</li><li>支持多课表、班级和课程编辑</li><li>分享链接仅展示你主动分享的课表</li></ul>
      </section>
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-tabs" role="tablist" aria-label="账户操作">
          <button id="login-tab" class="auth-tab" type="button" role="tab" aria-selected="false">登录</button>
          <button id="register-tab" class="auth-tab active" type="button" role="tab" aria-selected="true">注册</button>
        </div>
        <div class="notice error-notice" id="auth-error" role="alert" hidden></div>
        <form id="auth-form">
          <p class="eyebrow" id="auth-kicker">CREATE ACCOUNT</p>
          <h2 id="auth-title">创建个人账户</h2>
          <div class="register-fields" id="register-fields">
            <label>姓名<input id="auth-full-name" autocomplete="name" minlength="2" maxlength="30" required placeholder="请输入真实姓名" /></label>
            <label>专业班级<select id="auth-class" required disabled><option value="">正在加载班级…</option></select></label>
          </div>
          <label>用户名<input id="auth-username" autocomplete="username" minlength="3" maxlength="32" required placeholder="3–32 位字母、数字、点、下划线或连字符" /></label>
          <label>密码<input id="auth-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="8–128 位" /></label>
          <button class="button primary auth-submit" id="auth-submit" type="submit">注册并创建课表</button>
        </form>
        <p class="auth-note">账号和课表保存在当前浏览器中，登录状态保留 30 天。</p>
      </section>
    </main>
    <script src="../assets/api-client.js" defer></script>
    <script src="../assets/auth.js" defer></script>
  </body>
</html>
